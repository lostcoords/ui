# Curated bilingual emoji search aliases.
#
# Unicode CLDR Japanese annotations (emoji_search_names_ja.yml) read like a
# captioning dictionary, not the casual words people actually type. This file
# fills that gap with hand-picked English + Japanese synonyms, weighted toward
# the expense-splitting domain (food, transport, housing, bills, activities).
#
# Format: emoji => list of extra search terms (any language). Japanese kana
# terms are additionally indexed by their romaji automatically.
---
