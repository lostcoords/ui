name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ruby -r ./lib/lostcoords/ui/version -e 'abort "Tag does not match gem version" unless ENV.fetch("RELEASE_TAG") == "v#{Lostcoords::Ui::VERSION}"'
      - run: gem build lostcoords-ui.gemspec --output lostcoords-ui.gem
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a
      - run: gem push lostcoords-ui.gem --host https://rubygems.org
