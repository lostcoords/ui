name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ruby -r ./lib/lostcoords/ui/version -e 'abort "Tag does not match gem version" unless ENV.fetch("RELEASE_TAG") == "v#{Lostcoords::Ui::VERSION}"'
      - run: gem build lostcoords-ui.gemspec --output lostcoords-ui.gem
      - name: Authenticate with RubyGems
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const jwt = await core.getIDToken("rubygems.org");
            const response = await fetch("https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token", {
              method: "POST",
              headers: { "Content-Type": "application/json", Accept: "application/json" },
              body: JSON.stringify({ jwt, owner: "242093" })
            });
            if (!response.ok) throw new Error(`RubyGems authentication failed: HTTP ${response.status}`);
            const { rubygems_api_key: key } = await response.json();
            if (!key) throw new Error("RubyGems did not return a publishing key");
            core.setSecret(key);
            core.exportVariable("GEM_HOST_API_KEY", key);
      - run: gem push lostcoords-ui.gem --host https://rubygems.org
