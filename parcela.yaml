version: 1
project: ui

sharing:
  domain: tower.lostcoords.com

services:
  web:
    command: bin/rails server -p $PORT -b 127.0.0.1
    http:
      healthcheck: /
  css:
    command: bin/rails tailwindcss:watch[always]

hooks:
  setup:
    command: bundle check || bundle install
  prestart:
    command: bin/rails tailwindcss:build
